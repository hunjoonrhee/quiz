@for (q of questions(); track q; let i = $index) {
<div class="question">
  <app-question [question]="q" (change)="userAnswers[i] = $event" [canSwap]="quizService.canSwitchQuestion()"
    (swapQuestion)="onSwapClick($event)">
  </app-question>
</div>
}
<div>
  @if (allAnswered()) {
  <button class="inverse large" (click)="confirmDialog.open()">
    Submit
  </button>
  }
</div>

<app-dialog #confirmDialog title="Are you sure?">
  <ng-container body>
    Please confirm you want to submit your quiz
  </ng-container>

  <ng-container footer>
    <button class="tertiary" (click)="onConfirm()">OK</button>
    <button class="secondary" (click)="confirmDialog.close()">Not yet</button>
  </ng-container>
</app-dialog>
